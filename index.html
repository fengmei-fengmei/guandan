<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>掼蛋记牌器</title>
    <style>
        body { margin: 0; padding: 0; background-color: #1a252f; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; user-select: none; touch-action: manipulation; }
        
        /* 顶部标题和清零按钮 */
        .header { text-align: center; padding: 10px; display: flex; justify-content: space-between; align-items: center; padding-left: 15px; padding-right: 15px;}
        .title { font-size: 20px; font-weight: bold; color: #f1c40f; }
        .reset-btn { background-color: #e74c3c; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        
        /* 主体布局：三行 */
        .board { flex: 1; display: flex; flex-direction: column; gap: 15px; padding: 12px; padding-bottom: 20px; }
        
        /* 玩家区块增强立体感和分隔感 */
        .player { background-color: rgba(255,255,255,0.08); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; border: 1px solid #4a6278; flex: 1; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        
        /* 玩家名字 (重点修改：不同颜色区分，更显眼) */
        .player-name { font-weight: bold; margin-bottom: 10px; font-size: 20px; color: #ffffff; text-align: center; border-radius: 6px; padding: 6px 0; letter-spacing: 2px;}
        /* 对家 - 红色 */
        .top-player .player-name { background-color: #e74c3c; box-shadow: 0 2px 5px rgba(231, 76, 60, 0.4);}
        /* 上家 - 绿色 */
        .left-player .player-name { background-color: #27ae60; box-shadow: 0 2px 5px rgba(39, 174, 96, 0.4);}
        /* 下家 - 橙色 */
        .right-player .player-name { background-color: #f39c12; box-shadow: 0 2px 5px rgba(243, 156, 18, 0.4);}
        
        /* 卡片容器：横向排满 */
        .cards-container { display: flex; justify-content: space-between; gap: 8px; }
        
        /* 单张卡片样式 */
        .card { background-color: #2c3e50; border-radius: 8px; display: flex; flex-direction: column; flex: 1; cursor: pointer; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.3); min-width: 0; border: 1px solid #1a252f;}
        .card:active { transform: scale(0.95); }
        
        /* 卡片文字（牌型） */
        .card .label { font-size: 16px; font-weight: bold; text-align: center; padding: 8px 0; background-color: #34495e; color: #ecf0f1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        
        /* 数字显示区 */
        .card .status { font-size: 40px; font-weight: bold; text-align: center; padding: 10px 0; color: #f1c40f; flex: 1; display: flex; justify-content: center; align-items: center; }
        
        /* "无" 按钮区 */
        .card .btn-pass { font-size: 16px; font-weight: bold; text-align: center; background-color: #7f8c8d; color: white; padding: 8px 0; }
        .card .btn-pass:active { background-color: #e74c3c; }
        
        /* 状态颜色区分 */
        .card.status-0 .status { color: #95a5a6; font-size: 30px; font-weight: normal;} /* 无(0) 显示灰色 */
        .card.status-num .status { color: #2ecc71; } /* 出牌次数 显示绿色 */

    </style>
</head>
<body>

    <div class="header">
        <div class="title">掼蛋记牌器</div>
        <button class="reset-btn" onclick="resetAll()">全部清零</button>
    </div>

    <div class="board">
        <!-- 对家 -->
        <div class="player top-player">
            <div class="player-name">对家</div>
            <div class="cards-container">
                <div class="card" data-player="top" data-type="big"><div class="label">大王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="top" data-type="small"><div class="label">小王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="top" data-type="single"><div class="label">单牌</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="top" data-type="pair"><div class="label">对子</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="top" data-type="triple"><div class="label">三张</div><div class="status">-</div><div class="btn-pass">无</div></div>
            </div>
        </div>

        <!-- 上家 -->
        <div class="player left-player">
            <div class="player-name">上家</div>
            <div class="cards-container">
                <div class="card" data-player="left" data-type="big"><div class="label">大王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="left" data-type="small"><div class="label">小王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="left" data-type="single"><div class="label">单牌</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="left" data-type="pair"><div class="label">对子</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="left" data-type="triple"><div class="label">三张</div><div class="status">-</div><div class="btn-pass">无</div></div>
            </div>
        </div>

        <!-- 下家 -->
        <div class="player right-player">
            <div class="player-name">下家</div>
            <div class="cards-container">
                <div class="card" data-player="right" data-type="big"><div class="label">大王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="right" data-type="small"><div class="label">小王</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="right" data-type="single"><div class="label">单牌</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="right" data-type="pair"><div class="label">对子</div><div class="status">-</div><div class="btn-pass">无</div></div>
                <div class="card" data-player="right" data-type="triple"><div class="label">三张</div><div class="status">-</div><div class="btn-pass">无</div></div>
            </div>
        </div>
    </div>

    <script>
        // 只记录对家、上家、下家
        const players = ['top', 'left', 'right'];
        const types = ['big', 'small', 'single', 'pair', 'triple'];

        // 初始化数据结构。'-'代表未操作, '0'代表无(不出), 数字代表出牌次数
        let data = JSON.parse(localStorage.getItem('guandanDataV5')) || {}; // 升级版本号防旧数据干扰

        function initData() {
            let obj = {};
            players.forEach(p => {
                obj[p] = {};
                types.forEach(t => obj[p][t] = '-');
            });
            return obj;
        }

        if (Object.keys(data).length === 0) {
            data = initData();
        }

        // 渲染界面
        function render() {
            document.querySelectorAll('.card').forEach(card => {
                const p = card.dataset.player;
                const t = card.dataset.type;
                const statusVal = data[p][t];
                const statusDiv = card.querySelector('.status');
                
                statusDiv.innerText = statusVal;
                
                // 更改颜色样式
                card.classList.remove('status-0', 'status-num');
                if (statusVal === '0') {
                    card.classList.add('status-0');
                } else if (statusVal !== '-') {
                    card.classList.add('status-num');
                }
            });
        }

        // 保存并渲染
        function saveAndRender() {
            localStorage.setItem('guandanDataV5', JSON.stringify(data));
            render();
        }

        // 点击卡片主体：数字加1
        document.querySelectorAll('.card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (e.target.classList.contains('btn-pass')) return;

                const p = this.dataset.player;
                const t = this.dataset.type;
                let current = data[p][t];
                
                if (current === '-' || current === '0') {
                    data[p][t] = 1;
                } else {
                    data[p][t] = parseInt(current) + 1;
                }
                saveAndRender();
            });

            // 长按卡片主体：数字减1
            let timer;
            card.addEventListener('touchstart', function(e) {
                if (e.target.classList.contains('btn-pass')) return;
                timer = setTimeout(() => {
                    const p = this.dataset.player;
                    const t = this.dataset.type;
                    let current = data[p][t];
                    if (current !== '-' && current !== '0') {
                        let num = parseInt(current);
                        data[p][t] = num > 1 ? num - 1 : '-';
                        saveAndRender();
                    }
                }, 500);
            });
            card.addEventListener('touchend', () => clearTimeout(timer));
            card.addEventListener('touchmove', () => clearTimeout(timer));
        });

        // 点击“无”：变成0
        document.querySelectorAll('.btn-pass').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation(); 
                const card = this.parentElement;
                const p = card.dataset.player;
                const t = card.dataset.type;
                
                if (data[p][t] === '0') {
                    data[p][t] = '-'; 
                } else {
                    data[p][t] = '0';
                }
                saveAndRender();
            });
        });

        // 全部清零
        function resetAll() {
            if(confirm('确定要全部清零吗？')) {
                data = initData();
                saveAndRender();
            }
        }

        // 首次渲染
        render();
    </script>
</body>
</html>
